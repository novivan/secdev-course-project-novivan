apiVersion: apps/v1
kind: Deployment
metadata:
  name: secdev-app
  namespace: secdev-namespace
  labels:
    app: secdev-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secdev-app
  template:
    metadata:
      labels:
        app: secdev-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: secdev-app
        image: secdev-app:p12
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
        env:
        - name: DATABASE_URL
          value: "sqlite:////app/data/app.db"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
          readOnly: false
      volumes:
      - name: data-volume
        emptyDir: {}
